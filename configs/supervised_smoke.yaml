# Supervised smoke profile: the same network, optimizer and loader settings as
# supervised.yaml, but a 24-ply state-encoding limit so smoke artifacts
# and measurements agree with the smoke dataset.

model:
  size: small
  num_residual_blocks: 5
  num_channels: 128
  policy_channels: 16
  value_channels: 2

training:
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 64
  use_amp: true

rules:
  max_game_plies: 24
  no_capture_limit: 100

optimization:
  num_workers: 0

paths:
  checkpoint_dir: models/supervised_smoke/checkpoints
  best_model_path: models/supervised_smoke/best_model.pt
  log_dir: logs/supervised_smoke
