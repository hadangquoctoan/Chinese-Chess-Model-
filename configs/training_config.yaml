# Model configuration
model:
  size: medium  # small, medium, large
  num_residual_blocks: 10
  num_channels: 256
  policy_channels: 32
  value_channels: 4

# Training configuration
training:
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 512
  use_amp: true  # Mixed precision training

# Self-play configuration
self_play:
  num_games_per_iteration: 500
  mcts_simulations: 400
  temperature: 1.0
  temperature_threshold: 15  # After this many moves, use near-greedy
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  parallel_workers: 1  # Values >1 rejected: parallel self-play is not implemented
  max_game_plies: 200
  no_capture_limit: 100

# Replay buffer
replay_buffer:
  max_size: 500000  # Maximum number of positions to keep

# Training loop
training_loop:
  num_iterations: 50
  samples_per_iteration: 50000
  evaluation_games: 100
  score_threshold: 0.55  # Match score (wins + 0.5 * draws) / games must exceed this
  evaluation_mcts_simulations: 200
  evaluation_opening_plies: 4  # Reproducible openings paired with swapped colors
  evaluation_opening_seed: 0
  checkpoint_every: 5
  auto_checkpoint_interval: 0  # Seconds; 0 disables time-triggered checkpoints
  early_stopping_patience: 0  # Consecutive rejections; 0 disables early stopping

# Paths
paths:
  checkpoint_dir: models/checkpoints
  best_model_path: models/best_model.pt
  log_dir: logs/tensorboard
