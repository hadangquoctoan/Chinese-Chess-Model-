# 15-hour Windows GPU server run: same budget as train_depth2_16h.yaml.
# Tuned for an RTX 3090 24GB / 25-core Xeon: 8 self-play processes and
# fewer full-replay checkpoints. Time limits are enforced by scripts/run_16h.py.

model:
  size: small
  num_residual_blocks: 5
  num_channels: 128
  policy_channels: 16
  value_channels: 2

training:
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 2048
  use_amp: true

self_play:
  num_games_per_iteration: 48
  mcts_simulations: 128
  temperature: 1.0
  temperature_threshold: 15
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  parallel_workers: 8
  max_game_plies: 200
  no_capture_limit: 100

replay_buffer:
  max_size: 200000

training_loop:
  num_iterations: 200
  samples_per_iteration: 16000
  evaluation_games: 8
  score_threshold: 0.55
  evaluation_mcts_simulations: 80
  evaluation_opening_plies: 4
  evaluation_opening_seed: 0
  checkpoint_every: 5
  auto_checkpoint_interval: 1800
  early_stopping_patience: 0

optimization:
  num_workers: 8

paths:
  checkpoint_dir: models/checkpoints
  best_model_path: models/best_model.pt
  log_dir: logs/tensorboard

sparring:
  enabled: true
  ratio: 0.3
  depth: 1
  threads: 8
  hash_mb: 1024
  engine_path: pikafish/Pikafish-Windows-x86-64-universal.exe
